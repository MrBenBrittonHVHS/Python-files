<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python editor</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f6fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
    }

    main {
      width: min(100%, 1000px);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid #d8dfeb;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 8px 28px rgb(23 32 51 / 8%);
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid #e4e9f1;
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
    }

    #status {
      color: #58657a;
      font-size: 0.9rem;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr);
      min-height: 360px;
    }

    .panel {
      display: flex;
      min-width: 0;
      flex-direction: column;
    }

    .panel + .panel {
      border-left: 1px solid #e4e9f1;
    }

    .panel-title {
      padding: 12px 16px;
      border-bottom: 1px solid #e4e9f1;
      color: #43516a;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    #editor, #output {
      width: 100%;
      min-height: 300px;
      flex: 1;
      margin: 0;
      padding: 16px;
      border: 0;
      border-radius: 0;
      font: 14px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
      tab-size: 4;
    }

    #editor {
      resize: vertical;
      color: #172033;
      background: #fbfcfe;
    }

    textarea:focus-visible, button:focus-visible, summary:focus-visible {
      outline: 3px solid #85b7ff;
      outline-offset: -3px;
    }

    #output {
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #e7edf7;
      background: #111827;
    }

    #output:empty::before {
      color: #95a1b5;
      content: "Your program output will appear here.";
    }

    .terminal-input {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #111827;
    }

    .terminal-input[hidden] {
      display: none;
    }

    .terminal-prompt {
      color: #9fb0ca;
      font: 14px ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    #stdin {
      min-width: 0;
      flex: 1;
      padding: 7px 8px;
      border: 1px solid #45536b;
      border-radius: 4px;
      color: #e7edf7;
      background: #1d2738;
      font: 14px ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    #send-input {
      padding: 7px 10px;
      font-size: 0.85rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid #e4e9f1;
    }

    button {
      padding: 9px 16px;
      border: 0;
      border-radius: 7px;
      color: #fff;
      background: #1769d2;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #0e56b3;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    .hint {
      color: #58657a;
      font-size: 0.85rem;
    }

    details {
      padding: 0 16px 16px;
      color: #43516a;
      font-size: 0.9rem;
    }

    details p {
      margin: 10px 0 6px;
    }

    details code {
      display: block;
      padding: 10px;
      overflow-wrap: anywhere;
      border-radius: 6px;
      color: #172033;
      background: #f3f6fb;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    @media (max-width: 680px) {
      body {
        padding: 10px;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .panel + .panel {
        border-top: 1px solid #e4e9f1;
        border-left: 0;
      }

      #editor, #output {
        min-height: 220px;
      }
    }
  </style>
</head>
<body>
  Embeddable Python utilities<br>
    <a href="creator.html">Python editor</a><br>
    <a href="parsons.html">Parsons problem editor</a>
</body>
</html>
